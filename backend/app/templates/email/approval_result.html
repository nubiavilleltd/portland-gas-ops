<!-- Injected into base.html {{body_content}} -->
<!-- Sent to the requester when their request is approved, rejected, or returned -->

<h1>{{result_heading}}</h1>

<p>Hi {{requester_name}},</p>

<table style="width:100%; border:1px solid #e5e7eb; border-radius:8px; border-collapse:collapse; margin:20px 0;">
  <tr style="background:#f9fafb;">
    <td style="padding:10px 14px; font-size:13px; color:#6b7280; font-weight:600; width:40%; border-bottom:1px solid #e5e7eb;">Request</td>
    <td style="padding:10px 14px; font-size:13px; color:#111118; border-bottom:1px solid #e5e7eb;">{{request_title}}</td>
  </tr>
  <tr>
    <td style="padding:10px 14px; font-size:13px; color:#6b7280; font-weight:600; {{comment_row_style}}">Status</td>
    <td style="padding:10px 14px; font-size:13px; font-weight:600; color:{{action_color}}; {{comment_row_style}}">{{action_label}}</td>
  </tr>
  {{comment_row_html}}
</table>

<p>{{result_message}}</p>

<a href="{{action_url}}" class="btn">View Request</a>

<hr class="divider" />

<p style="font-size:12px; color:#9ca3af;">
  If the button above does not work, copy and paste this link into your browser:<br />
  <a href="{{action_url}}" style="color:#7c3aed; word-break:break-all;">{{action_url}}</a>
</p>
