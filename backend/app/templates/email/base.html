<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{subject}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #f6f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .wrapper { max-width: 560px; margin: 40px auto; padding: 0 16px; }
    .card { background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .header { background: #0d0d12; padding: 28px 32px; display: flex; align-items: center; gap: 20px; }
    .logo-mark { width: 40px; height: 40px; background: #7c3aed; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .logo-mark span { color: #ffffff; font-size: 14px; font-weight: 700; letter-spacing: -0.5px; }
    .logo-img { width: 40px; height: 40px; border-radius: 10px; object-fit: contain; }
    .brand-name { color: #ffffff; font-size: 15px; font-weight: 600; }
    .brand-sub { color: #a78bfa; font-size: 12px; margin-top: 1px; }
    .body { padding: 36px 32px; }
    .body h1 { font-size: 20px; font-weight: 700; color: #111118; margin-bottom: 10px; }
    .body p { font-size: 14px; color: #6b7280; line-height: 1.7; margin-bottom: 16px; }
    .otp-box { background: #f5f3ff; border: 1px solid #ede9fe; border-radius: 12px; padding: 20px; text-align: center; margin: 24px 0; }
    .otp-code { font-size: 36px; font-weight: 800; letter-spacing: 10px; color: #7c3aed; font-family: 'Courier New', monospace; }
    .otp-note { font-size: 12px; color: #6b7280; margin-top: 8px; }
    .btn { display: inline-block; background: #7c3aed; color: #ffffff !important; text-decoration: none; padding: 12px 28px; border-radius: 8px; font-size: 14px; font-weight: 600; margin: 20px 0; }
    .btn:hover { background: #5b21b6; }
    .divider { border: none; border-top: 1px solid #e5e7eb; margin: 24px 0; }
    .footer { padding: 20px 32px; background: #f9fafb; border-top: 1px solid #e5e7eb; }
    .footer p { font-size: 12px; color: #9ca3af; line-height: 1.6; }
    .footer a { color: #7c3aed; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">

      <!-- Header -->
      <div class="header">
        {{logo_html}}
        <div>
          <div class="brand-name">Portland Gas Limited</div>
          <div class="brand-sub">Operations Platform</div>
        </div>
      </div>

      <!-- Body — each template injects content here -->
      <div class="body">
        {{body_content}}
      </div>

      <!-- Footer -->
      <div class="footer">
        <p>
          This email was sent by Portland Gas Limited Operations Platform.<br />
          If you did not request this, please ignore this email or
          <a href="mailto:support@portlandgas.com">contact support</a>.
        </p>
        <p style="margin-top:8px;">© 2026 Portland Gas Limited. All rights reserved.</p>
      </div>

    </div>
  </div>
</body>
</html>
