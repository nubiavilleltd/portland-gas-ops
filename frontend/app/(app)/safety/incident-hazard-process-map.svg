<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1960" viewBox="0 0 1600 1960" fill="none">
  <defs>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #667085; }
      .section { font: 700 16px Arial, sans-serif; fill: #6941c6; letter-spacing: 1px; }
      .node-title { font: 700 18px Arial, sans-serif; fill: #101828; }
      .node-body { font: 400 15px Arial, sans-serif; fill: #667085; }
      .status { font: 700 15px Arial, sans-serif; fill: #6941c6; }
      .branch { font: 700 14px Arial, sans-serif; fill: #344054; }
      .foot { font: 400 15px Arial, sans-serif; fill: #475467; }
      .arrow { stroke: #98a2b3; stroke-width: 2.5; fill: none; }
      .purple-arrow { stroke: #7f56d9; stroke-width: 3; fill: none; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11" stroke="#98A2B3" stroke-width="2" fill="none"/>
    </marker>
    <marker id="purpleArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11" stroke="#7F56D9" stroke-width="2" fill="none"/>
    </marker>
  </defs>

  <rect width="1600" height="1960" fill="#F8F8FA"/>
  <rect x="48" y="40" width="1504" height="1880" rx="28" fill="white" stroke="#EAECF0" stroke-width="2"/>

  <text x="96" y="105" class="title">Incident &amp; Hazard Report Process Map</text>
  <text x="96" y="140" class="subtitle">Requester to HSE review, corrective-work execution, action-owner resolution, and HSE closure</text>

  <rect x="96" y="180" width="1408" height="54" rx="14" fill="#F4F3FF"/>
  <text x="120" y="213" class="section">STATUS PATH</text>
  <text x="310" y="213" class="status">Submitted</text>
  <path d="M400 207H448" class="purple-arrow" marker-end="url(#purpleArrow)"/>
  <text x="480" y="213" class="status">Recommended</text>
  <path d="M610 207H658" class="purple-arrow" marker-end="url(#purpleArrow)"/>
  <text x="690" y="213" class="status">Resolved</text>
  <path d="M786 207H834" class="purple-arrow" marker-end="url(#purpleArrow)"/>
  <text x="866" y="213" class="status">Closed</text>
  <text x="1050" y="213" class="node-body">Direct path: Submitted -> Closed</text>

  <!-- Initial report -->
  <rect x="560" y="280" width="480" height="94" rx="16" fill="white" stroke="#D0D5DD" stroke-width="2"/>
  <text x="800" y="318" class="node-title" text-anchor="middle">Requester Raises Incident / Hazard Report</text>
  <text x="800" y="346" class="node-body" text-anchor="middle">Incident, hazard, near miss, or unsafe condition reported</text>

  <path d="M800 374V421" class="arrow" marker-end="url(#arrow)"/>
  <rect x="600" y="432" width="400" height="78" rx="16" fill="#FFFAEB" stroke="#FEDF89" stroke-width="2"/>
  <text x="800" y="465" class="node-title" text-anchor="middle">Submitted to HSE</text>
  <text x="800" y="490" class="status" text-anchor="middle">Status: Submitted</text>

  <path d="M800 510V554" class="arrow" marker-end="url(#arrow)"/>
  <path d="M800 564L1025 658L800 752L575 658Z" fill="#F4F3FF" stroke="#B692F6" stroke-width="2"/>
  <text x="800" y="648" class="node-title" text-anchor="middle">HSE Review</text>
  <text x="800" y="675" class="node-body" text-anchor="middle">Corrective work required?</text>

  <!-- No branch -->
  <text x="1064" y="628" class="branch">NO</text>
  <path d="M1025 658H1225V707" class="arrow" marker-end="url(#arrow)"/>
  <rect x="1115" y="718" width="350" height="92" rx="16" fill="#ECFDF3" stroke="#ABEFC6" stroke-width="2"/>
  <text x="1290" y="752" class="node-title" text-anchor="middle">HSE Records Findings</text>
  <text x="1290" y="778" class="node-body" text-anchor="middle">No corrective work needed</text>
  <path d="M1290 810V854" class="arrow" marker-end="url(#arrow)"/>
  <rect x="1135" y="865" width="310" height="72" rx="36" fill="#DCFAE6" stroke="#17B26A" stroke-width="2"/>
  <text x="1290" y="910" class="node-title" text-anchor="middle">Closed</text>

  <!-- Yes branch and corrective flow -->
  <text x="496" y="628" class="branch">YES</text>
  <path d="M575 658H370V707" class="purple-arrow" marker-end="url(#purpleArrow)"/>
  <rect x="130" y="718" width="480" height="106" rx="16" fill="#F4F3FF" stroke="#B692F6" stroke-width="2"/>
  <text x="370" y="755" class="node-title" text-anchor="middle">HSE Recommends Corrective Work</text>
  <text x="370" y="782" class="node-body" text-anchor="middle">Assign Department + Action Owner</text>
  <text x="370" y="806" class="status" text-anchor="middle">Status: Recommended</text>

  <path d="M370 824V870" class="purple-arrow" marker-end="url(#purpleArrow)"/>
  <rect x="130" y="881" width="480" height="112" rx="16" fill="white" stroke="#D0D5DD" stroke-width="2"/>
  <text x="370" y="918" class="node-title" text-anchor="middle">Action Owner Raises Work Initiation</text>
  <text x="370" y="945" class="node-body" text-anchor="middle">Category: Incident / Hazard</text>
  <text x="370" y="969" class="node-body" text-anchor="middle">Selects the recommended incident lookup</text>

  <path d="M610 937H676" class="arrow" marker-end="url(#arrow)"/>
  <rect x="688" y="881" width="370" height="112" rx="16" fill="white" stroke="#D0D5DD" stroke-width="2"/>
  <text x="873" y="918" class="node-title" text-anchor="middle">Operational Approval</text>
  <text x="873" y="945" class="node-body" text-anchor="middle">Supervisor approves</text>
  <text x="873" y="969" class="node-body" text-anchor="middle">Operations HOD approves</text>

  <path d="M1058 937H1124" class="arrow" marker-end="url(#arrow)"/>
  <rect x="1136" y="881" width="328" height="112" rx="16" fill="#ECFDF3" stroke="#ABEFC6" stroke-width="2"/>
  <text x="1300" y="918" class="node-title" text-anchor="middle">Work Initiation Approved</text>
  <text x="1300" y="947" class="node-body" text-anchor="middle">Eligible for safety authorization</text>

  <path d="M1300 993V1044H1060" class="arrow" marker-end="url(#arrow)"/>
  <rect x="690" y="1055" width="370" height="112" rx="16" fill="white" stroke="#D0D5DD" stroke-width="2"/>
  <text x="875" y="1092" class="node-title" text-anchor="middle">Work Authorization</text>
  <text x="875" y="1119" class="node-body" text-anchor="middle">HSE safety review and inspection</text>
  <text x="875" y="1143" class="node-body" text-anchor="middle">Approve, Return, or Deny</text>

  <path d="M690 1111H624" class="arrow" marker-end="url(#arrow)"/>
  <rect x="184" y="1055" width="428" height="112" rx="16" fill="#ECFDF3" stroke="#ABEFC6" stroke-width="2"/>
  <text x="398" y="1092" class="node-title" text-anchor="middle">Work Authorized</text>
  <text x="398" y="1119" class="node-body" text-anchor="middle">Safety conditions passed</text>
  <text x="398" y="1143" class="node-body" text-anchor="middle">Corrective work may begin</text>

  <path d="M398 1167V1212" class="arrow" marker-end="url(#arrow)"/>
  <rect x="184" y="1223" width="428" height="88" rx="16" fill="white" stroke="#D0D5DD" stroke-width="2"/>
  <text x="398" y="1260" class="node-title" text-anchor="middle">Corrective Work Performed</text>
  <text x="398" y="1286" class="node-body" text-anchor="middle">Assigned department/action owner completes work</text>

  <path d="M612 1267H680" class="arrow" marker-end="url(#arrow)"/>
  <rect x="692" y="1210" width="426" height="114" rx="16" fill="white" stroke="#D0D5DD" stroke-width="2"/>
  <text x="905" y="1247" class="node-title" text-anchor="middle">Work Completion &amp; Close-Out</text>
  <text x="905" y="1274" class="node-body" text-anchor="middle">Supervisor -> Operations Head -> HSE</text>
  <text x="905" y="1298" class="node-body" text-anchor="middle">Completion approved</text>

  <path d="M1118 1267H1188" class="arrow" marker-end="url(#arrow)"/>
  <rect x="1200" y="1200" width="264" height="134" rx="16" fill="#F4F3FF" stroke="#B692F6" stroke-width="2"/>
  <text x="1332" y="1235" class="node-title" text-anchor="middle">System Validates Link</text>
  <text x="1332" y="1263" class="node-body" text-anchor="middle">Completion -> Authorization</text>
  <text x="1332" y="1287" class="node-body" text-anchor="middle">-> Initiation -> Incident</text>
  <text x="1332" y="1311" class="node-body" text-anchor="middle">Same incident confirmed</text>

  <path d="M1332 1334V1380H1058" class="purple-arrow" marker-end="url(#purpleArrow)"/>
  <rect x="692" y="1391" width="366" height="108" rx="16" fill="#F4F3FF" stroke="#B692F6" stroke-width="2"/>
  <text x="875" y="1427" class="node-title" text-anchor="middle">Completion Auto-Populates</text>
  <text x="875" y="1454" class="node-body" text-anchor="middle">Linked approved close-out appears</text>
  <text x="875" y="1478" class="node-body" text-anchor="middle">on the incident record</text>

  <path d="M692 1445H624" class="purple-arrow" marker-end="url(#purpleArrow)"/>
  <rect x="184" y="1391" width="428" height="108" rx="16" fill="#ECFDF3" stroke="#ABEFC6" stroke-width="2"/>
  <text x="398" y="1428" class="node-title" text-anchor="middle">Action Owner Marks Resolved</text>
  <text x="398" y="1456" class="node-body" text-anchor="middle">Uses validated completed work evidence</text>
  <text x="398" y="1480" class="status" text-anchor="middle">Status: Resolved</text>

  <path d="M398 1499V1550" class="purple-arrow" marker-end="url(#purpleArrow)"/>
  <rect x="184" y="1561" width="428" height="94" rx="16" fill="white" stroke="#D0D5DD" stroke-width="2"/>
  <text x="398" y="1599" class="node-title" text-anchor="middle">HSE Verifies Resolution</text>
  <text x="398" y="1626" class="node-body" text-anchor="middle">Reviews corrective close-out evidence</text>

  <path d="M398 1655V1700" class="purple-arrow" marker-end="url(#purpleArrow)"/>
  <rect x="243" y="1711" width="310" height="76" rx="38" fill="#DCFAE6" stroke="#17B26A" stroke-width="2"/>
  <text x="398" y="1759" class="node-title" text-anchor="middle">Closed</text>

  <rect x="96" y="1840" width="1408" height="44" rx="12" fill="#F9FAFB"/>
  <text x="120" y="1868" class="foot">Validation rule: linked Work Completion must belong to an authorization whose Work Initiation references the same Incident / Hazard Report.</text>
</svg>
